<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Iklan Lowongan 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Poppins', Arial, sans-serif; background:#f1f3f6; color:#1f2937; }
  .wrap { display:flex; flex-wrap:wrap; gap:24px; max-width:1000px; margin:0 auto; padding:24px 16px; }
  .panel { flex:1 1 340px; background:#fff; border-radius:16px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .preview { flex:0 1 380px; text-align:center; }
  h1 { font-size:20px; margin:0 0 16px; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 4px; }
  input[type=text], input[type=date], textarea {
    width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; font:inherit; font-size:14px;
  }
  textarea { min-height:130px; resize:vertical; }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  input[type=color] { width:100%; height:40px; border:1px solid #d1d5db; border-radius:10px; padding:2px; background:#fff; }
  small { color:#6b7280; font-size:12px; }
  button { margin-top:18px; width:100%; padding:12px; border:0; border-radius:12px; background:#2563eb; color:#fff;
    font:inherit; font-weight:600; font-size:15px; cursor:pointer; }
  button:hover { background:#1d4ed8; }
  button.ghost { background:#e5e7eb; color:#111827; margin-top:8px; }
  canvas { width:100%; max-width:360px; height:auto; aspect-ratio:9/16; border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,.2); background:#ddd; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Generator Iklan Lowongan (9:16)</h1>

    <label>Posisi / Tema lowongan</label>
    <input type="text" id="posisi" value="Staff Admin">

    <label>Nama perusahaan</label>
    <input type="text" id="perusahaan" value="PT Maju Bersama">

    <label>Persyaratan <small>(satu baris = satu poin)</small></label>
    <textarea id="syarat">Pendidikan minimal SMA/SMK/D3 semua jurusan
Pengalaman di bidang administrasi min. 1 tahun
Menguasai Microsoft Office (Word, Excel)
Teliti, rapi, dan jujur
Domisili Jakarta dan sekitarnya
Siap bekerja dalam tim</textarea>

    <div class="row">
      <div>
        <label>Paling lambat</label>
        <input type="date" id="deadline">
      </div>
      <div>
        <label>Warna tema</label>
        <input type="color" id="warna" value="#1e3a8a">
      </div>
    </div>

    <label>Kirim lamaran ke <small>(web / email)</small></label>
    <input type="text" id="alamat" value="www.karir.majubersama.co.id">

    <label>Gambar <small>(opsional, otomatis di-crop)</small></label>
    <input type="file" id="gambar" accept="image/*">

    <button id="unduh">Unduh PNG (1080 × 1920)</button>
    <button class="ghost" id="hapusGambar">Hapus gambar</button>
  </div>

  <div class="panel preview">
    <canvas id="c" width="1080" height="1920"></canvas>
  </div>
</div>

<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let img = null;

// tanggal default: 14 hari dari hari ini
(function () {
  const d = new Date(); d.setDate(d.getDate() + 14);
  $('deadline').value = d.toISOString().slice(0, 10);
})();

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, v + amt));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

function wrap(text, maxW) {
  const words = text.split(/\s+/); const lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function formatTanggal(v) {
  if (!v) return '-';
  const [y, m, d] = v.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

function draw() {
  const main = $('warna').value;
  const dark = shade(main, -40);
  const accent = '#fbbf24';
  const FONT = "'Poppins', Arial, sans-serif";

  // background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, main); bg.addColorStop(1, dark);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // area gambar (bawahnya melengkung)
  const IMG_H = 820;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, IMG_H - 80);
  ctx.quadraticCurveTo(W / 2, IMG_H + 60, 0, IMG_H - 80);
  ctx.closePath(); ctx.clip();

  if (img) {
    const r = Math.max(W / img.width, IMG_H / img.height);
    const w = img.width * r, h = img.height * r;
    ctx.drawImage(img, (W - w) / 2, (IMG_H - h) / 2, w, h);
  } else {
    const g = ctx.createLinearGradient(0, 0, W, IMG_H);
    g.addColorStop(0, shade(main, 60)); g.addColorStop(1, shade(main, -10));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, IMG_H);
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.beginPath(); ctx.arc(850, 250, 280, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(150, 600, 220, 0, 7); ctx.fill();
  }
  // gradasi gelap agar teks terbaca
  const ov = ctx.createLinearGradient(0, 200, 0, IMG_H + 60);
  ov.addColorStop(0, 'rgba(0,0,0,0)'); ov.addColorStop(1, 'rgba(0,0,0,.65)');
  ctx.fillStyle = ov; ctx.fillRect(0, 0, W, IMG_H + 60);
  ctx.restore();

  // garis aksen di bawah lengkungan
  ctx.strokeStyle = accent; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, IMG_H - 70); ctx.quadraticCurveTo(W / 2, IMG_H + 70, W, IMG_H - 70); ctx.stroke();

  // badge
  ctx.fillStyle = accent; rr(60, 60, 360, 80, 40); ctx.fill();
  ctx.fillStyle = '#111827'; ctx.font = `800 36px ${FONT}`; ctx.textBaseline = 'middle';
  ctx.textAlign = 'center'; ctx.fillText("WE'RE HIRING!", 240, 102);

  // perusahaan
  ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = `600 34px ${FONT}`;
  ctx.fillText($('perusahaan').value, W - 60, 102);

  // judul posisi
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#fff'; ctx.font = `600 40px ${FONT}`;
  ctx.fillText('DICARI SEGERA', 60, 520);
  const title = ($('posisi').value || '').toUpperCase();
  let size = 130, lines;
  for (; size >= 56; size -= 4) {
    ctx.font = `800 ${size}px ${FONT}`;
    lines = wrap(title, W - 120);
    if (lines.length <= 3) break;
  }
  ctx.fillStyle = accent;
  const lh = size * 1.08;
  const startY = 520 + lh + 4;
  lines.forEach((l, i) => ctx.fillText(l, 60, startY + i * lh));

  // PERSYARATAN
  ctx.fillStyle = accent; ctx.font = `800 44px ${FONT}`;
  ctx.fillText('PERSYARATAN', 60, 930);
  ctx.fillRect(60, 950, 160, 6);

  const items = $('syarat').value.split('\n').map(s => s.trim()).filter(Boolean);
  const top = 995, bottom = 1500, maxW = W - 120 - 60;
  let fs = 44, total;
  for (; fs >= 22; fs -= 2) {
    ctx.font = `400 ${fs}px ${FONT}`;
    total = 0;
    items.forEach(t => total += wrap(t, maxW).length * fs * 1.3 + 22);
    if (total - 22 <= bottom - top) break;
  }
  ctx.font = `400 ${fs}px ${FONT}`; ctx.fillStyle = '#fff';
  let y = top;
  items.forEach(t => {
    const ls = wrap(t, maxW);
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.arc(76, y + fs * 0.7, fs * 0.25, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ls.forEach((l, i) => ctx.fillText(l, 120, y + fs * 0.95 + i * fs * 1.3));
    y += ls.length * fs * 1.3 + 22;
  });

  // deadline
  ctx.fillStyle = accent; rr(60, 1530, W - 120, 150, 28); ctx.fill();
  ctx.fillStyle = '#111827'; ctx.textAlign = 'center';
  ctx.font = `600 32px ${FONT}`; ctx.fillText('Lamaran paling lambat', W / 2, 1585);
  ctx.font = `800 54px ${FONT}`; ctx.fillText(formatTanggal($('deadline').value), W / 2, 1650);

  // kirim ke
  ctx.fillStyle = '#fff'; ctx.font = `600 32px ${FONT}`;
  ctx.fillText('Kirim lamaran Anda ke:', W / 2, 1750);
  ctx.fillStyle = 'rgba(255,255,255,.15)'; rr(60, 1775, W - 120, 100, 50); ctx.fill();
  let as = 46; const addr = $('alamat').value;
  do { ctx.font = `800 ${as}px ${FONT}`; as -= 2; } while (ctx.measureText(addr).width > W - 180 && as > 20);
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
  ctx.fillText(addr, W / 2, 1827);
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
}

// event
['posisi', 'perusahaan', 'syarat', 'deadline', 'warna', 'alamat'].forEach(id => $(id).addEventListener('input', draw));
$('gambar').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => { img = im; draw(); };
  im.src = url;
});
$('hapusGambar').addEventListener('click', () => { img = null; $('gambar').value = ''; draw(); });
$('unduh').addEventListener('click', () => {
  cv.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'iklan-lowongan-' + ($('posisi').value || 'kerja').toLowerCase().replace(/\s+/g, '-') + '.png';
    a.click();
  }, 'image/png');
});

draw();
if (document.fonts) document.fonts.load("800 40px Poppins").then(() => document.fonts.load("400 40px Poppins")).then(draw);
</script>
</body>
</html>
